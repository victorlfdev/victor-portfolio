server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Otimização de I/O
    sendfile on;
    tcp_nopush on;

    # Gzip focado em arquivos de texto (evita recompactar imagens já compactadas)
    gzip on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Arquivos estáticos estáticos com cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Favicon
    location /favicon.svg {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    # Roteamento SPA e index (sem cache para permitir atualizações instantâneas)
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}