server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json image/png image/jpg image/webp;
    gzip_min_length 256;

    location /assets/ {
        cache_control "max-age=31536000, immutable";
        expires 31536000s;
        access_log off;
    }

    location /favicon.svg {
        cache_control "no-cache";
        expires -1;
    }

    location / {
        cache_control "no-cache";
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}